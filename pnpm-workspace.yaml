packages:
  - cloudflare-os/packages/workshop-shared
  - cloudflare-os/packages/error-reporting
  - cloudflare-os/scripts
  - packages/*

# Mirror of cloudflare-os/pnpm-workspace.yaml's catalog. Required, not merely tidy: the two
# kernel packages above are members of THIS workspace, and both declare `catalog:` specifiers
# that resolve here rather than in the kernel -- without these entries `pnpm install` fails
# outright.
#
# The kernel's catalog is the source of truth for shared entries: the vendored kernel directory
# syncs with upstream (`.github/workflows/sync-upstream.yml`), and `scripts/catalog-sync.ts`
# re-syncs this block automatically on every sync. Drift is silent if left alone: the kernel and
# the starter install separately, so a different capnweb range gives the tree two copies, and a
# stub minted by one is unserialisable by the other's session
# (`TypeError: Cannot serialize value: [object RpcStub]`). A deduped dev machine hides it; the
# split installs in CI and on a fresh checkout do not. See cloudflare-os/docs/integration-testing.md.
catalog:
  '@cloudflare/vitest-pool-workers': ^0.22.0
  '@cloudflare/workers-types': ^5.20260903.1
  capnweb: ^0.12.0
  diff: ^8.0.4
  # Exact: pinned in lockstep with capnweb (declared as a >=0.7.0 peer)
  capnweb-validate: 0.3.0
  # Exact: TypeScript 7 (tsgo). The kernel's tsconfig sets `singleThreaded`, which TS 5.9
  # rejects outright, so every package extending it has to be on 7.x. Nothing here uses the JS
  # compiler API, so the kernel's `typescript6` alias is not needed.
  typescript: 7.0.2
  # Exact, not ranged: the transform has to stay on esbuild. Oxc does not lower the Stage-3
  # decorators capnweb-validate's `@validateRpc()` relies on (cloudflare/workers-sdk#12626).
  vite: 7.3.6
  vite-plus: ^0.2.8
  vitest: ^4.1.11
  wrangler: ^4.128.0

overrides:
  '@cloudflare/vitest-pool-workers>miniflare': 5.20260831.0-alpha
  '@cloudflare/vitest-pool-workers>wrangler': "catalog:"
  # Vitest peers can resolve vite@latest, so the version is pinned rather than ranged. Points at the
  # catalog so this and the manifests can't disagree: a catalog only covers what a workspace
  # manifest declares itself, and the override is what reaches vite as somebody else's peer.
  vite: "catalog:"
  # Arrives as an optional vite/vitest peer resolved to `latest`; pinned to the same release the
  # kernel pins so the two installs agree.
  '@types/node': 26.1.0

allowBuilds:
  '@google/genai': true
  core-js-pure: true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.81'
  - ai@7.0.101
