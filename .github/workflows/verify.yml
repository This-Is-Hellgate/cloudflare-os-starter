name: verify

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.17.0

      - name: Install starter dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Cloudflare OS dependencies
        run: pnpm --dir cloudflare-os install --frozen-lockfile

      - name: Verify repository
        run: pnpm check
